<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d">
  <title id="t">How the Offerings Atlas runs</title>
  <desc id="d">Researcher agents fill a controls matrix of 151 platforms by 44 controls. An evaluator fetches each cited page, stores it by hash, has a model pick a verbatim passage and checks the passage is really on the page. A curator writes verified records into an OKF tree with frontmatter, chunks and an eligibility rule. A questionnaire routes a client's concerns to controls and answers them from eligible records with checked citations. A freshness agent hashes source sections and queues rechecks, or raises a pull request with an approver chain in an enterprise tree. Every model call goes through a local gateway that runs Claude and Codex headless.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9" fill="none" stroke="#263d35" stroke-width="1.4" stroke-opacity=".7"/>
    </marker>
    <style>
      .edge { fill:none; stroke:#263d35; stroke-width:1.4; stroke-opacity:.55; }
      .edge-soft { fill:none; stroke:#263d35; stroke-width:1; stroke-opacity:.35; stroke-dasharray:3 6; }
      .edge-red { fill:none; stroke:#963d36; stroke-width:1.4; stroke-opacity:.7; }
      .orbit { fill:none; stroke:#263d35; stroke-width:.7; stroke-opacity:.35; stroke-dasharray:2 5; }
      .hub { fill:#faf7ee; stroke:#263d35; stroke-width:1.5; }
      .ring { fill:none; stroke:#963d36; stroke-width:2; }
      .core { fill:#963d36; }
      .dot { fill:#3d6b5f; fill-opacity:.75; }
      .label { font:600 17px 'Schibsted Grotesk', system-ui, sans-serif; fill:#263d35; }
      .sub { font:400 13.5px 'Schibsted Grotesk', system-ui, sans-serif; fill:#4b6059; }
      .tag { font:600 11px 'Schibsted Grotesk', system-ui, sans-serif; fill:#963d36; letter-spacing:.08em; }
      .num { font:600 12px 'Schibsted Grotesk', system-ui, sans-serif; fill:#faf7ee; }
      .band { fill:#dce2d3; fill-opacity:.55; stroke:#c9bea6; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f3ecde"/>

  <!-- gateway band underneath every model call -->
  <rect class="band" x="40" y="636" width="1120" height="56" rx="6"/>
  <text class="tag" x="62" y="660">UNDER EVERY MODEL CALL</text>
  <text class="label" x="62" y="681">Local LLM gateway: claude -p and codex exec, headless, JSON schema out, proof log per call</text>

  <!-- edges of the loop -->
  <path class="edge" marker-end="url(#arrow)" d="M196 214Q262 168 330 200"/>
  <path class="edge" marker-end="url(#arrow)" d="M470 214Q536 168 604 200"/>
  <path class="edge" marker-end="url(#arrow)" d="M744 214Q810 168 878 200"/>
  <path class="edge" marker-end="url(#arrow)" d="M740 396Q800 404 842 436"/>
  <path class="edge-red" marker-end="url(#arrow)" d="M560 470Q470 500 386 470"/>
  <path class="edge" marker-end="url(#arrow)" d="M810 460Q720 470 660 466"/>
  <path class="edge-soft" marker-end="url(#arrow)" d="M300 430Q240 360 230 300"/>
  <path class="edge-soft" d="M120 600L120 560M400 600L400 560M680 600L680 560M960 600L960 560"/>

  <!-- 1 research -->
  <circle class="orbit" cx="130" cy="240" r="46"/>
  <circle class="hub" cx="130" cy="240" r="24"/>
  <text class="num" x="124" y="245" style="fill:#263d35">1</text>
  <circle class="dot" cx="88" cy="196" r="3"/><circle class="dot" cx="176" cy="200" r="2.4"/><circle class="dot" cx="96" cy="286" r="2.2"/>
  <text class="tag" x="62" y="318">RESEARCHER AGENTS</text>
  <text class="label" x="62" y="340">A controls matrix</text>
  <text class="sub" x="62" y="360">151 platforms by 44 controls</text>
  <text class="sub" x="62" y="378">6,644 findings, 3,655 sources</text>

  <!-- 2 evaluator -->
  <circle class="orbit" cx="404" cy="240" r="46"/>
  <circle class="hub" cx="404" cy="240" r="24"/>
  <text class="num" x="398" y="245" style="fill:#263d35">2</text>
  <circle class="dot" cx="362" cy="198" r="2.6"/><circle class="dot" cx="448" cy="206" r="3"/><circle class="dot" cx="440" cy="286" r="2"/>
  <text class="tag" x="336" y="318">EVALUATOR AGENT</text>
  <text class="label" x="336" y="340">Checkable proof</text>
  <text class="sub" x="336" y="360">Fetch, hash, judge, then check</text>
  <text class="sub" x="336" y="378">the quote is really on the page</text>

  <!-- 3 OKF -->
  <circle class="orbit" cx="678" cy="240" r="46"/>
  <circle class="hub" cx="678" cy="240" r="24"/>
  <text class="num" x="672" y="245" style="fill:#263d35">3</text>
  <circle class="dot" cx="634" cy="204" r="2.2"/><circle class="dot" cx="722" cy="198" r="2.8"/><circle class="dot" cx="716" cy="284" r="2.4"/>
  <text class="tag" x="610" y="318">CURATOR AND INGEST</text>
  <text class="label" x="610" y="340">An OKF knowledge tree</text>
  <text class="sub" x="610" y="360">YAML frontmatter, tags, chunks</text>
  <text class="sub" x="610" y="378">and a rule for what agents may read</text>

  <!-- 4 questionnaire, the accent node -->
  <circle class="orbit" cx="944" cy="240" r="52"/>
  <circle class="ring" cx="944" cy="240" r="20"/>
  <circle class="core" cx="944" cy="240" r="10"/>
  <circle class="dot" cx="896" cy="200" r="2.6"/><circle class="dot" cx="994" cy="206" r="3"/><circle class="dot" cx="990" cy="288" r="2.2"/>
  <text class="tag" x="1010" y="226">4 THE QUESTIONNAIRE</text>
  <text class="label" x="1010" y="248">Client concerns in,</text>
  <text class="label" x="1010" y="268">cited answers out</text>
  <text class="sub" x="1010" y="288">Every citation checked</text>
  <text class="sub" x="1010" y="306">against the tree</text>

  <!-- freshness -->
  <circle class="hub" cx="860" cy="450" r="16"/>
  <circle class="dot" cx="822" cy="430" r="2.2"/><circle class="dot" cx="896" cy="476" r="2.6"/>
  <text class="tag" x="790" y="500">FRESHNESS AGENT</text>
  <text class="label" x="790" y="522">Hash sections, not pages</text>
  <text class="sub" x="790" y="542">Only changed pages go back to the judge</text>

  <!-- enterprise gate -->
  <circle class="ring" cx="608" cy="466" r="13"/>
  <circle class="core" cx="608" cy="466" r="6"/>
  <text class="tag" x="530" y="500">ENTERPRISE GATE, SIMULATED</text>
  <text class="label" x="530" y="522">A pull request with approvers</text>
  <text class="sub" x="530" y="542">Owner, security reviewer, publisher</text>

  <!-- back to research -->
  <circle class="hub" cx="330" cy="466" r="16"/>
  <text class="tag" x="250" y="500">RESEARCHER AGENTS AGAIN</text>
  <text class="label" x="250" y="522">New wording, rechecked</text>
  <text class="sub" x="250" y="542">The loop closes without a person</text>
  <text class="sub" x="250" y="560">for facts, with one for advice</text>
</svg>
